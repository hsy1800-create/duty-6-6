<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBEFF4">
<style>
  :root{color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>6-6 데일리 크루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EBEFF4;
  --surface:#FFFFFF;
  --surface2:#F4F7FA;
  --line:#D5DDE6;
  --line2:#E7EDF3;
  --ink:#141B23;
  --ink2:#5B6978;
  --ink3:#8A98A6;
  --a:#1A5FA6;      --a-soft:#E3EEF9;  --a-line:#B9D4EC;
  --b:#0B7355;      --b-soft:#DCF0E9;  --b-line:#A9D9C8;
  --c:#9A5414;      --c-soft:#F7E9D8;  --c-line:#E7C79E;
  --done:#13773A;   --done-soft:#E1F3E6; --done-line:#A9DCB9;
  --late:#B8321C;   --late-soft:#FBE4DF; --late-line:#EFB3A6;
  --now:#0F4C81;
  --shadow:0 1px 2px rgba(20,27,35,.06), 0 10px 24px -14px rgba(20,27,35,.2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1218; --surface:#171E26; --surface2:#1D252E; --line:#2B3742; --line2:#232C36;
    --ink:#E7EDF3; --ink2:#96A5B4; --ink3:#71818F;
    --a:#7AB8EE;   --a-soft:#15293B;  --a-line:#2A4A69;
    --b:#45CBA3;   --b-soft:#0F2E28;  --b-line:#1F5245;
    --c:#E3A868;   --c-soft:#312310;  --c-line:#56401F;
    --done:#4FD07C; --done-soft:#12301D; --done-line:#215437;
    --late:#FF806A; --late-soft:#3A1B16; --late-line:#6B3025;
    --now:#8CC4F0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1218; --surface:#171E26; --surface2:#1D252E; --line:#2B3742; --line2:#232C36;
  --ink:#E7EDF3; --ink2:#96A5B4; --ink3:#71818F;
  --a:#7AB8EE;   --a-soft:#15293B;  --a-line:#2A4A69;
  --b:#45CBA3;   --b-soft:#0F2E28;  --b-line:#1F5245;
  --c:#E3A868;   --c-soft:#312310;  --c-line:#56401F;
  --done:#4FD07C; --done-soft:#12301D; --done-line:#215437;
  --late:#FF806A; --late-soft:#3A1B16; --late-line:#6B3025;
  --now:#8CC4F0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0; font-weight:400; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer; font-family:inherit}
:focus-visible{outline:3px solid var(--now); outline-offset:2px; border-radius:6px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.dh{font-family:'Do Hyeon','IBM Plex Sans KR',sans-serif; font-weight:400}
.spacer{flex:1 1 20px}

.wrap{max-width:1360px; margin:0 auto; padding:0 16px; padding-block:12px 26px}

/* ── 상단 바 ─────────────────────────── */
.top{display:flex; align-items:center; gap:10px; flex-wrap:nowrap; margin-bottom:12px; position:relative}
.topright{display:flex; align-items:center; gap:8px; flex:none; margin-left:auto}
.topdate{display:flex; align-items:baseline; gap:9px; min-width:0; flex:1 1 auto; overflow:hidden}
.topdate .d,.topdate .wd,.topdate .cl{white-space:nowrap}
.topdate .d{font-size:clamp(19px,2.1vw,26px)}
@media (max-width:520px){.topdate .wd{display:none} .wideonly{display:none}}
.topdate .wd{font-size:clamp(13px,1.3vw,16px); color:var(--ink2)}
.topdate .cl{font-size:clamp(17px,1.9vw,24px); color:var(--ink2); margin-left:4px}

.chip{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  border-radius:999px; padding:5px 13px; font-size:13px; font-weight:600;
  border:1px solid var(--line); background:var(--surface); color:var(--ink2);
}
.chip.ok{background:var(--done-soft); border-color:var(--done-line); color:var(--done)}
.chip.late{background:var(--late-soft); border-color:var(--late-line); color:var(--late)}

.menubtn{
  border:1px solid var(--line); background:var(--surface); border-radius:10px;
  width:42px; height:38px; font-size:19px; line-height:1; color:var(--ink3);
  display:grid; place-items:center;
}
.menubtn:hover,.menubtn.on{background:var(--surface2); color:var(--ink)}
.sheet{
  position:absolute; right:0; top:46px; z-index:40; width:230px;
  background:var(--surface); border:1px solid var(--line); border-radius:13px;
  box-shadow:0 12px 32px -8px rgba(20,27,35,.28); padding:6px; display:flex; flex-direction:column; gap:1px;
}
.sheet .lbl{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink3); padding:9px 11px 4px}
.sheet button{
  border:0; background:none; text-align:left; border-radius:8px; padding:9px 11px;
  font-size:14px; font-weight:500; display:flex; align-items:center; gap:9px;
}
.sheet button:hover{background:var(--surface2)}
.sheet button[disabled]{opacity:.4; cursor:default}
.sheet hr{border:0; border-top:1px solid var(--line2); margin:5px 8px}

/* ── 오늘의 당번 ─────────────────────── */
.hero{
  display:grid; grid-template-columns:1fr 1px 1fr;
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px;
}
.hero .sep{background:var(--line)}
@media (max-width:680px){ .hero{grid-template-columns:1fr} .hero .sep{height:1px} }
.hside{padding:13px 18px 15px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; min-width:0}
.hside.A{border-top:5px solid var(--a)}
.hside.B{border-top:5px solid var(--b)}
.tagsq{
  font-family:'Do Hyeon',sans-serif; font-size:18px; width:34px; height:34px; flex:none;
  border-radius:9px; display:grid; place-items:center; align-self:center;
}
.tagsq.A{background:var(--a); color:#fff}
.tagsq.B{background:var(--b); color:#fff}
.tagsq.C{background:var(--c); color:#fff; font-size:13px; width:auto; padding:0 10px}
.hnum{font-size:clamp(44px,6vw,82px); line-height:.9; letter-spacing:-.03em}
.hside.A .hnum{color:var(--a)} .hside.B .hnum{color:var(--b)}
.hnum small{font-size:.34em; letter-spacing:0; color:var(--ink2); margin-left:.05em}
.hname{font-size:clamp(21px,2.7vw,36px); line-height:1.1; overflow-wrap:anywhere}
.hname.empty{font-size:15px; color:var(--ink3)}
.hrole{flex-basis:100%; font-size:clamp(13px,1.3vw,16px); color:var(--ink2); margin-top:2px}
.hflags{display:flex; gap:6px; margin-left:auto; align-self:center; flex-wrap:wrap}
.hflags .chip{font-size:11.5px; padding:3px 9px}

/* ── 지금 할 일 ──────────────────────── */
.focus{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:12px;
}
.fhead{
  display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
  padding:14px 20px; background:var(--a-soft); border-bottom:1px solid var(--a-line);
}
.focus.notnow .fhead{background:var(--surface2); border-bottom-color:var(--line)}
.fhead .ttl{font-size:clamp(22px,2.8vw,32px); color:var(--a)}
.focus.notnow .fhead .ttl{color:var(--ink)}
.fhead .tm{font-size:14px; color:var(--ink2)}
.livedot{width:10px; height:10px; border-radius:50%; background:var(--a); flex:none}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.3; transform:scale(.78)}}
.focus:not(.notnow) .livedot{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.livedot{animation:none!important}}
.backnow{
  border:1px solid var(--a-line); background:var(--surface); color:var(--a);
  border-radius:9px; padding:6px 12px; font-size:13px; font-weight:600; margin-left:auto;
}

.frow{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:none; border:0; border-top:1px solid var(--line2); padding:14px 20px;
  min-height:70px;
}
.frow:first-child{border-top:0}
.frow:hover{background:var(--surface2)}
.frow.done{background:var(--done-soft)}
.frow.done:hover{background:var(--done-soft)}
.ftext{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px}
.ftext .t{font-size:clamp(17px,1.9vw,23px); font-weight:500; overflow-wrap:anywhere}
.ftext .n{font-size:clamp(12.5px,1.2vw,14.5px); color:var(--ink3); overflow-wrap:anywhere}
.frow.done .ftext .t{color:var(--ink3); text-decoration:line-through; text-decoration-thickness:2px}
.ring{
  width:38px; height:38px; flex:none; border-radius:50%;
  border:3px solid var(--line); background:var(--surface);
  display:grid; place-items:center; transition:background .15s, border-color .15s;
}
.ring svg{width:21px; height:21px; opacity:0; stroke:#fff; stroke-width:3.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
.frow.done .ring{background:var(--done); border-color:var(--done)}
.frow.done .ring svg{opacity:1}
.frow.wrapi .ring{border-radius:11px}
.frow.locked{cursor:default}
.frow.locked:hover{background:none}
.frow.locked.done:hover{background:var(--done-soft)}
.frow.locked:not(.done) .ring{opacity:.35; border-style:dashed}
.fempty{padding:28px 20px; text-align:center; color:var(--ink3); font-size:16px}

/* ── 나 · 학생 화면 ──────────────────── */
.mecard{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:12px;
  border-top:6px solid var(--line);
}
.mecard.A{border-top-color:var(--a)} .mecard.B{border-top-color:var(--b)}
.melead{display:flex; align-items:center; gap:13px; flex-wrap:wrap}
.metitle{font-size:clamp(25px,3.4vw,42px); line-height:1.12}
.mecard.A .metitle{color:var(--a)} .mecard.B .metitle{color:var(--b)}
.mesub{font-size:15px; color:var(--ink2); margin-top:6px}
.mewhen{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:4px}
.mewhen .big{font-size:clamp(26px,3.4vw,40px)}
.mewhen .cnt{font-size:15px; color:var(--ink2)}
.todaypair{display:flex; gap:10px 22px; flex-wrap:wrap; margin-top:10px}
.tp{display:flex; align-items:center; gap:9px}
.tp .v{font-size:clamp(18px,2.1vw,25px)}
.mebtn{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:6px 13px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px;
}
.mebtn:hover{background:var(--surface2)}

.picker{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px 20px; margin-bottom:12px}
.picker h2{font-size:clamp(22px,2.8vw,30px); margin-bottom:6px}
.picker p{margin:0 0 16px; color:var(--ink2); font-size:14.5px}
.nogrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px}
.nobtn{
  border:1.5px solid var(--line); background:var(--surface2); border-radius:12px;
  padding:13px 10px; font-size:15px; font-weight:600; text-align:center;
  display:flex; flex-direction:column; gap:2px; align-items:center; min-height:62px; justify-content:center;
}
.nobtn:hover{border-color:var(--now); background:var(--surface)}
.nobtn .n{font-family:'Do Hyeon',sans-serif; font-size:21px}
.nobtn .nm{font-size:12.5px; color:var(--ink2); font-weight:500}
.roombtn{
  width:100%; border:1.5px solid var(--a-line); background:var(--a-soft); color:var(--a);
  border-radius:13px; padding:15px 18px; font-size:16px; font-weight:600; text-align:left; margin-bottom:18px;
}
.roombtn small{display:block; font-weight:500; font-size:13px; color:var(--ink2); margin-top:3px}

/* ── 밀린 일 ─────────────────────────── */
.lateblk{
  background:var(--late-soft); border:1px solid var(--late-line); border-radius:14px;
  margin-bottom:12px; overflow:hidden;
}
.latehd{
  display:flex; align-items:center; gap:10px; width:100%; background:none; border:0;
  padding:12px 18px; font-size:16px; font-weight:600; color:var(--late); text-align:left;
}
.latehd .cnt{margin-left:auto; font-size:13px; font-weight:700}
.lateblk .frow{border-top-color:var(--late-line); min-height:60px; padding:10px 18px}
.lateblk .frow:hover{background:rgba(0,0,0,.03)}

/* ── 하루 흐름 ───────────────────────── */
.timeline{
  display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:12px;
  scrollbar-width:thin;
}
.tpill{
  flex:0 0 auto; border:1.5px solid var(--line); background:var(--surface);
  border-radius:13px; padding:9px 15px; min-width:104px; text-align:left;
  display:flex; flex-direction:column; gap:3px;
}
.tpill .lb{font-size:13.5px; font-weight:600; white-space:nowrap}
.tpill .st{font-size:11.5px; color:var(--ink3); display:flex; align-items:center; gap:5px}
.tpill.sel{border-color:var(--now); box-shadow:inset 0 0 0 1.5px var(--now)}
.tpill.cur{background:var(--a-soft); border-color:var(--a-line)}
.tpill.cur .lb{color:var(--a)}
.tpill.full{background:var(--done-soft); border-color:var(--done-line)}
.tpill.full .lb,.tpill.full .st{color:var(--done)}
.tpill.miss{border-color:var(--late-line); background:var(--late-soft)}
.tpill.miss .lb,.tpill.miss .st{color:var(--late)}

.footbar{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; padding:2px}
.ghost{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--ink2)}
.ghost:hover{background:var(--surface2); color:var(--ink)}
.rail{height:8px; border-radius:99px; background:var(--line2); overflow:hidden; flex:1 1 120px; min-width:90px; max-width:260px}
.rail>i{display:block; height:100%; background:var(--done); border-radius:99px; transition:width .35s ease}

/* ── 전체 보기 ───────────────────────── */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); overflow:hidden}
.card.A{border-top:5px solid var(--a)}
.card.B{border-top:5px solid var(--b)}
.card.C{border-top:5px solid var(--c); margin-top:12px}
.chead{display:flex; align-items:center; gap:11px; padding:12px 16px; flex-wrap:wrap}
.chead .ttl{font-size:19px}
.chead .cnt{margin-left:auto; font-size:13.5px; font-weight:600; color:var(--ink2)}
.slotgrp{border-top:1px solid var(--line2); break-inside:avoid}
.slothdr{display:flex; align-items:center; gap:8px; padding:7px 16px 3px; font-size:11.5px; font-weight:700; letter-spacing:.07em; color:var(--ink3)}
.slothdr .tm{margin-left:auto; font-weight:500; letter-spacing:0}
.trow{display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; background:none; border:0; border-top:1px solid transparent; padding:9px 16px}
.trow+.trow{border-top-color:var(--line2)}
.trow:hover{background:var(--surface2)}
.box{width:24px; height:24px; flex:none; border-radius:7px; margin-top:1px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center}
.box svg{width:15px; height:15px; opacity:0; stroke:#fff; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round}
.trow.done .box{background:var(--done); border-color:var(--done)}
.trow.done .box svg{opacity:1}
.trow.overdue .box{border-color:var(--late)}
.tt{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px}
.tt .t{font-size:15.5px; font-weight:500; overflow-wrap:anywhere}
.trow.done .tt .t{color:var(--ink3); text-decoration:line-through}
.tt .n{font-size:12.5px; color:var(--ink3); overflow-wrap:anywhere}
.tmk{font-size:11px; color:var(--ink3); flex:none; margin-top:4px}
.trow.overdue .tmk{color:var(--late); font-weight:700}
.common .cbody{column-count:2; column-gap:0}
@media (max-width:760px){.common .cbody{column-count:1}}

.notice{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:12px; padding:13px 16px; margin-bottom:12px; box-shadow:var(--shadow)}
.notice b{font-weight:700}
.notice p{margin:4px 0 0; color:var(--ink2); font-size:14px}

/* ── 패널 ────────────────────────────── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px}
.panel h2{font-size:20px; margin-bottom:4px}
.panel .hint{color:var(--ink2); font-size:13.5px; margin:0 0 14px}
.sect{border-top:1px solid var(--line2); padding-top:14px; margin-top:16px}
.sect>h3{font-size:16px; margin-bottom:8px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:7px 9px; border-bottom:1px solid var(--line2)}
th{font-size:11.5px; letter-spacing:.06em; color:var(--ink3); font-weight:700}
.scrollx{overflow-x:auto}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  font:inherit; color:var(--ink); background:var(--surface2);
  border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:100%;
}
textarea{min-height:130px; resize:vertical; line-height:1.6}
label{font-size:12.5px; font-weight:600; color:var(--ink2); display:block; margin-bottom:4px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface2); border-radius:9px; padding:8px 14px; font-size:13.5px; font-weight:600}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--now); border-color:var(--now); color:#fff}
.btn.warn{color:var(--late); border-color:var(--late)}
.ed{display:grid; grid-template-columns:110px 1fr 1fr 34px; gap:6px; align-items:center; margin-bottom:6px}
@media (max-width:640px){.ed{grid-template-columns:1fr 1fr}.ed>*:nth-child(2){grid-column:1/-1}}
.del{border:1px solid var(--line); background:var(--surface2); border-radius:8px; padding:6px 0; font-size:14px; color:var(--late)}
.pill{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); color:var(--ink2); margin:0 4px 4px 0}
.muted{color:var(--ink3); font-size:13px}
.bar{height:6px; border-radius:99px; background:var(--line2); overflow:hidden; min-width:54px}
.bar>i{display:block; height:100%; background:var(--done)}
.linkbtn{background:none; border:0; font-size:13px; font-weight:600; color:var(--ink2); text-decoration:underline; text-underline-offset:3px; padding:5px 4px}
pre{background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:12px 14px; overflow-x:auto; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12.5px; line-height:1.6; margin:8px 0 0}
code{font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:.92em; background:var(--surface2); border:1px solid var(--line2); border-radius:5px; padding:1px 5px}
details summary{padding:4px 0}

body.tv{font-size:17px}
body.tv .wrap{max-width:none}
body.tv .frow{min-height:84px}
body.tv .ftext .t{font-size:clamp(20px,2.3vw,28px)}
body.tv .ring{width:44px; height:44px}
body.tv .tpill .lb{font-size:15px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topdate">
      <span class="d dh" id="hDate">—</span>
      <span class="wd" id="hWd"></span>

/* ── 저장소 ──────────────────────────── */
const Store = {
  kind: 'local', cdb: null, readOnly: false, chains: {}, standalone: false, note: '',
  fpath(p) { return 'classes/' + CLASS_ID + '/' + p; },

  async init() {
    if (window.claude && window.claude.use) {
      try { const d = await window.claude.use('db'); if (d) { this.cdb = d; this.kind = 'db'; return; } } catch (e) {}
    } else {
      this.standalone = true;
    }
    if (FB && FB.projectId) {
      const ok = await initFirebase();
      this.note = fbNote;
      if (ok) { this.kind = 'firebase'; return; }
    }
    this.kind = 'local';
  },

  async get(path) {
    if (this.kind === 'db') {
      try { const s = await this.cdb.doc(path).get(); return s.exists ? s.data() : null; } catch (e) { return null; }
    }
    if (this.kind === 'firebase') {
      try { const s = await fstore.doc(this.fpath(path)).get(); return s.exists ? s.data() : null; }
      catch (e) { this.note = (e && e.message) || String(e); return null; }
    }
    try { const v = localStorage.getItem('duty66:' + path); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },

  set(path, data) {
    const prev = this.chains[path] || Promise.resolve();
    const next = prev.catch(() => {}).then(async () => {
      if (this.kind === 'db') {
        try { await this.cdb.doc(path).set(data); }
        catch (e) { if (e && e.code === 'invalid_argument') { Store.readOnly = true; render(); } throw e; }
        return;
      }
      if (this.kind === 'firebase') {
        try { await fstore.doc(this.fpath(path)).set(data); }
        catch (e) { Store.note = (e && e.message) || String(e); throw e; }
        return;
      }
      try { localStorage.setItem('duty66:' + path, JSON.stringify(data)); } catch (e) {}
      local.emit(path, data);
    });
    this.chains[path] = next;
    return next;
  },

  watch(path, cb) {
    if (this.kind === 'db') {
      try { return this.cdb.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), () => {}); } catch (e) { return () => {}; }
    }
    if (this.kind === 'firebase') {
      try { return fstore.doc(this.fpath(path)).onSnapshot(s => cb(s.exists ? s.data() : null), () => {}); } catch (e) { return () => {}; }
    }
    this.get(path).then(cb);
    return local.on(path, cb);
  },

  async recent(n) {
    if (this.kind === 'db') {
      try { const q = await this.cdb.collection('days').orderBy('date', 'desc').limit(n).get(); return q.docs.map(d => d.data()); }
      catch (e) { return []; }
    }
    if (this.kind === 'firebase') {
      try {
        const q = await fstore.collection('classes/' + CLASS_ID + '/days').orderBy('date', 'desc').limit(n).get();
        return q.docs.map(d => d.data());
      } catch (e) { return []; }
    }
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('duty66:days/')) out.push(JSON.parse(localStorage.getItem(k)));
      }

  },

      try { const r = await this.cdb.doc('config/lock').acquire({ holder: TAB, ttlMs: 8000 }); return !!r.acquired; } catch (e) { return true; }
    }
    if (this.kind === 'firebase') {
      try {
        const ref = fstore.doc(this.fpath('config/lock'));
        return await fstore.runTransaction(async tx => {
          const s = await tx.get(ref);
          const now = Date.now();
          const d = s.exists ? s.data() : null;
          if (d && d.until > now && d.holder !== TAB) return false;
          tx.set(ref, { holder: TAB, until: now + 8000 });
          return true;
        });
      } catch (e) { return true; }
    }
    return true;
  },
};
const local = {
  subs: {},
  on(p, cb) { (this.subs[p] = this.subs[p] || []).push(cb); return () => { this.subs[p] = (this.subs[p] || []).filter(f => f !== cb); }; },
  emit(p, v) { (this.subs[p] || []).forEach(f => f(v)); },
};

/* ── 상태 ────────────────────────────── */
const state = {
  view: 'board', mode: 'focus', focusSlot: null, showLate: false, me: null, picked: false, peek: false,
  today: null, day: null, roster: null, rotation: null, tasks: null,
  holidays: null, slotTimes: null, recent: [], lastSlot: undefined,
};

const clamp = n => Math.max(0, Math.min(100, n));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function roster() { return state.roster || { count: 22, names: {} }; }
function tasksOf() { return state.tasks || DEFAULT_TASKS; }
function holidays() { return (state.holidays && state.holidays.dates) || []; }
function slotWindow(key) {
  const b = SLOTMAP[key] || {}, ov = (state.slotTimes || {})[key] || {};
  return { from: ov.from || b.from, to: ov.to || b.to };
}
function nameOf(no) { if (!no) return ''; const n = (roster().names || {})[String(no)]; return n ? String(n).trim() : ''; }
function who(no) { return no ? no + '번' + (nameOf(no) ? ' ' + nameOf(no) : '') : '–'; }
function isSchoolDay(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !holidays().includes(dkey(d)); }
function nextSchoolDay(from) {
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 40; i++) { d.setDate(d.getDate() + 1); if (isSchoolDay(d)) return d; }
  return d;
}
function defaultRotation() { const c = roster().count || 22; return { order: Array.from({ length: c }, (_, i) => i + 1), cursor: 0, requeue: [] }; }
function cloneRot(r) {
  const b = r && Array.isArray(r.order) && r.order.length ? r : defaultRotation();
  return { order: b.order.slice(), cursor: b.cursor || 0, requeue: (b.requeue || []).slice() };
}
function pickFrom(rot) {
  if (rot.requeue.length) return rot.requeue.shift();
  const n = rot.order[rot.cursor % rot.order.length];
  rot.cursor = (rot.cursor + 1) % rot.order.length;
  return n;
}
function pickPair(rot) { const a = pickFrom(rot); let b = pickFrom(rot); if (b === a) b = pickFrom(rot); return [a, b]; }

function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function toMin(s) { if (!s) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; }
function currentSlot() {
  const n = nowMin();
  for (const s of SLOTS) { const w = slotWindow(s.key); if (w.from && w.to && n >= toMin(w.from) && n < toMin(w.to)) return s.key; }
  return null;
}
function upcomingSlot() {
  const n = nowMin();
  let best = null, bestv = Infinity;
  for (const s of SLOTS) { const w = slotWindow(s.key); if (w.from && toMin(w.from) > n && toMin(w.from) < bestv) { best = s.key; bestv = toMin(w.from); } }
  return best;
}
function slotPassed(key) { const w = slotWindow(key); return w.to ? nowMin() >= toMin(w.to) : false; }
function autoSlot() { return currentSlot() || upcomingSlot() || 'anytime'; }
function activeSlot() { return state.focusSlot || autoSlot(); }

/* ── 나는 누구인가 ───────────────────── */
function loadMe() {
  let v = null;
  try { v = localStorage.getItem('duty66:me'); } catch (e) {}
  if (v === null || v === '') { state.picked = false; state.me = null; return; }
  state.picked = true;
  state.me = v === 'room' ? null : (parseInt(v, 10) || null);
}
function saveMe(v) {
  try { localStorage.setItem('duty66:me', v == null ? 'room' : String(v)); } catch (e) {}
  state.picked = true; state.me = v;
}
function isRoom() { return state.picked && state.me == null; }
function myRole() {
  if (!state.picked || state.me == null) return 'ALL';
  const d = state.day || {};
  if (d.a === state.me) return 'A';
  if (d.b === state.me) return 'B';
  return null;
}
function canCheck(it) {
  const r = myRole();
  if (r === 'ALL') return true;
  if (!r) return false;
  return it.role === r || it.role === 'C';
}
function myNextDuty() {
  if (state.me == null) return null;
  const d0 = state.today ? fromKey(state.today) : new Date();
  const day = state.day || {};
  if (day.a === state.me) return { date: d0, role: 'A', days: 0 };
  if (day.b === state.me) return { date: d0, role: 'B', days: 0 };
  const rot = cloneRot(state.rotation);
  let d = d0;
  for (let i = 0; i < 140; i++) {
    d = nextSchoolDay(d);
    const [a, b] = pickPair(rot);
    if (a === state.me) return { date: d, role: 'A', days: i + 1 };
    if (b === state.me) return { date: d, role: 'B', days: i + 1 };
  }
  return null;
}
function teacherPin() { return (state.teacher && state.teacher.pin) || ''; }
function unlocked() { try { return localStorage.getItem('duty66:unlock') === teacherPin(); } catch (e) { return false; } }
function askPin() {
  const p = teacherPin();
  if (!p) return true;
  if (unlocked()) return true;
  const v = prompt('선생님 번호를 넣어 주세요');
  if (v === p) { try { localStorage.setItem('duty66:unlock', p); } catch (e) {} return true; }
  if (v !== null) alert('번호가 맞지 않습니다.');
  return false;
}

function itemsForSlot(key) {
  const t = tasksOf(), out = [];
  (t.A || []).forEach(x => { if (x.slot === key) out.push({ ...x, role: 'A', by: 'a' }); });
  (t.B || []).forEach(x => { if (x.slot === key) out.push({ ...x, role: 'B', by: 'b' }); });
  (t.C || []).forEach(x => { if (x.slot === key) out.push({ ...x, role: 'C', by: 'both' }); });
  return out;
}
function allItems() { return SLOTS.flatMap(s => itemsForSlot(s.key)); }

async function boot() {
  loadMe();
  render();
  await Store.init();
  Store.watch('config/teacher', v => { state.teacher = v; softRender(); });
  Store.watch('config/roster', v => { state.roster = v; softRender(); });
  Store.watch('config/rotation', v => { state.rotation = v; softRender(); });
  Store.watch('config/tasks', v => { state.tasks = v && v.A ? v : null; softRender(); });
  Store.watch('config/holidays', v => { state.holidays = v; softRender(); });
  Store.watch('config/slots', v => { state.slotTimes = v; softRender(); });

  state.teacher = await Store.get('config/teacher');
  state.roster = await Store.get('config/roster');
  state.rotation = await Store.get('config/rotation');
  const t = await Store.get('config/tasks'); state.tasks = t && t.A ? t : null;
  state.holidays = await Store.get('config/holidays');
  state.slotTimes = await Store.get('config/slots');
  if (!state.rotation) state.rotation = defaultRotation();

  await openToday();
  render();
  setInterval(tick, 15000);
  tick();
}

let dayUnsub = null;
async function openToday() {
  const now = new Date(), key = dkey(now);
  state.today = key;
  if (dayUnsub) { dayUnsub(); dayUnsub = null; }
  if (!isSchoolDay(now)) { state.day = await Store.get('days/' + key); return; }
  state.day = await ensureDay(key);
  dayUnsub = Store.watch('days/' + key, v => { if (v) { state.day = v; softRender(); } });
}

async function ensureDay(key) {
  let d = await Store.get('days/' + key);
  if (d) return d;
  if (Store.readOnly) return null;
  const got = await Store.lease();
  if (!got) { await new Promise(r => setTimeout(r, 1500)); return await Store.get('days/' + key); }
  d = await Store.get('days/' + key);
  if (d) return d;
  const rot = cloneRot(state.rotation);
  const [a, b] = pickPair(rot);
  const day = { date: key, a, b, checks: {}, absent: [], swaps: [], wrap: {}, createdAt: new Date().toISOString() };
  try { await Store.set('days/' + key, day); await Store.set('config/rotation', rot); state.rotation = rot; } catch (e) {}
  return day;
}

function tick() {
  const key = dkey(new Date());
  if (key !== state.today) { state.focusSlot = null; openToday().then(render); return; }
  paintTop();
  const cs = autoSlot();
  if (state.view === 'board' && cs !== state.lastSlot) { state.lastSlot = cs; render(); }
}

function dayCopy() {
  const d = state.day || {};
  return { ...d, checks: { ...(d.checks || {}) }, absent: (d.absent || []).slice(), swaps: (d.swaps || []).slice(), wrap: { ...(d.wrap || {}) } };
}
async function toggleTask(id, by) {
  if (!state.day || Store.readOnly) return;
  const day = dayCopy();
  if (day.checks[id]) delete day.checks[id];
  else day.checks[id] = { t: new Date().toISOString(), by };

  try { await Store.set('days/' + day.date, day); } catch (e) {}
}
async function toggleWrap(role) {
  if (!state.day || Store.readOnly) return;
  const day = dayCopy();
  if (day.wrap[role]) delete day.wrap[role]; else day.wrap[role] = { t: new Date().toISOString() };
  state.day = day; softRender();

}
async function markAbsent(role) {
  if (!state.day || Store.readOnly) return;
  const day = dayCopy(), out = day[role], other = role === 'a' ? day.b : day.a;
  const rotBefore = cloneRot(state.rotation), rot = cloneRot(state.rotation);
  let rep = pickFrom(rot);
  if (rep === other || rep === out) rep = pickFrom(rot);
  rot.requeue.unshift(out);
  day[role] = rep; day.absent.push(out);
  day.swaps.push({ role, out, in: rep, rotBefore, t: new Date().toISOString() });
  state.day = day; state.rotation = rot; render();
  try { await Store.set('days/' + day.date, day); await Store.set('config/rotation', rot); } catch (e) {}
}
async function undoAbsent() {
  if (!state.day || Store.readOnly) return;
  const day = dayCopy(), last = day.swaps.pop();
  if (!last) return;
  day[last.role] = last.out;
  day.absent = day.absent.filter(n => n !== last.out);
  state.day = day; state.rotation = cloneRot(last.rotBefore); render();
  try { await Store.set('days/' + day.date, day); await Store.set('config/rotation', state.rotation); } catch (e) {}
}

function timeline() {

    const items = itemsForSlot(s.key);

    const cls = ['tpill', s.key === sel ? 'sel' : '', s.key === cur ? 'cur' : '', full ? 'full' : '', miss ? 'miss' : ''].filter(Boolean).join(' ');

    + esc(Array.from({ length: r.count || 22 }, (_, i) => (r.names || {})[String(i + 1)] || '').join('\n'))
    + '</textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="saveNames">명단 저장</button></div></div>';

  html += '<div class="sect"><h3 class="dh">순번</h3>'
    + '<p class="muted" style="margin:0 0 8px">다음 등교일 당번은 <b>' + esc(who(na) + ' · ' + who(nb)) + '</b> 입니다.</p>';
  if (rot.requeue.length) html += '<p class="muted" style="margin:0 0 8px">결석으로 밀린 당번: ' + rot.requeue.map(n => n + '번').join(', ') + '</p>';
  html += '<div class="row"><label style="margin:0">다음 당번을 지정</label><select id="sCursor" style="width:130px">'
    + Array.from({ length: r.count || 22 }, (_, i) => '<option value="' + i + '"' + (rot.cursor % (r.count || 22) === i ? ' selected' : '') + '>' + (i + 1) + '번부터</option>').join('')
    + '</select><button class="btn" id="saveCursor">순번 맞추기</button>'
    + '<button class="btn warn" id="clearQ">밀린 당번 지우기</button></div></div>';

  html += '<div class="sect"><h3 class="dh">휴업일</h3>'
    + '<p class="muted" style="margin:0 0 8px">주말은 자동으로 빠집니다. 재량휴업일·방학만 넣어 주세요.</p>'
    + '<div class="row" style="margin-bottom:8px"><input type="date" id="sHol" style="width:180px"><button class="btn" id="addHol">추가</button></div><div>'
    + (holidays().length ? holidays().sort().map(h => '<span class="pill">' + h + ' <button class="linkbtn" data-delhol="' + h + '" style="color:var(--late)">✕</button></span>').join('') : '<span class="muted">등록된 날이 없습니다.</span>')
    + '</div></div>';

  html += '<div class="sect"><h3 class="dh">시간대</h3><p class="muted" style="margin:0 0 8px">이 시간이 되면 화면이 알아서 해당 묶음으로 넘어갑니다.</p>';
  for (const s of SLOTS) {
    if (!SLOTMAP[s.key].from) continue;
    const w = slotWindow(s.key);
    html += '<div class="row" style="margin-bottom:6px"><span style="width:82px;font-weight:600">' + s.label + '</span>'
      + '<input type="time" data-slotfrom="' + s.key + '" value="' + w.from + '" style="width:130px"><span class="muted">–</span>'
      + '<input type="time" data-slotto="' + s.key + '" value="' + w.to + '" style="width:130px"></div>';
  }
  html += '<div class="row" style="margin-top:8px"><button class="btn pri" id="saveSlots">시간대 저장</button></div></div>';

  for (const role of ['A', 'B', 'C']) {
    const title = role === 'C' ? '함께 하는 일' : '당번 ' + role + ' 미션 — ' + ROLE_TITLE[role];
    html += '<div class="sect"><h3 class="dh">' + title + '</h3><div id="ed' + role + '">';
    (t[role] || []).forEach(x => {
      html += '<div class="ed" data-role="' + role + '">'
        + '<select data-f="slot">' + SLOTS.map(s => '<option value="' + s.key + '"' + (s.key === x.slot ? ' selected' : '') + '>' + s.label + '</option>').join('') + '</select>'
        + '<input type="text" data-f="text" value="' + esc(x.text) + '">'
        + '<input type="text" data-f="note" placeholder="설명 (선택)" value="' + esc(x.note || '') + '">'
        + '<button class="del" data-delrow="1" title="삭제">✕</button></div>';
    });
    html += '</div><div class="row" style="margin-top:8px"><button class="btn" data-addrow="' + role + '">＋ 항목 추가</button>'
      + '<button class="btn pri" data-savetasks="' + role + '">저장</button>'
      + '<button class="btn" data-resettasks="' + role + '">기본값으로</button></div></div>';
  }

  html += '<div class="sect"><h3 class="dh">선생님 잠금</h3>'
    + '<p class="muted" style="margin:0 0 8px">번호를 정해 두면, 아이들 기기에서 교실 화면이나 이 설정으로 들어갈 때 번호를 물어봅니다. 비워 두면 잠그지 않습니다.</p>'
    + '<div class="row"><input type="text" id="pinBox" inputmode="numeric" maxlength="8" value="' + esc(teacherPin()) + '" placeholder="예: 6606" style="width:150px">'
    + '<button class="btn pri" id="savePin">저장</button></div></div>';

  html += '<div class="sect"><h3 class="dh">오늘 당번 다시 뽑기</h3><p class="muted" style="margin:0 0 8px">오늘 체크한 기록도 함께 지워집니다.</p>'
    + '<button class="btn warn" id="reroll">오늘 당번 다시 배정</button></div></div>';
  return html;
}

/* ── 렌더 ────────────────────────────── */
function softRender() { if (state.view === 'board') render(); }
function render() {
  const main = document.getElementById('main');
  main.innerHTML = !state.picked ? pickView()
    : state.view === 'log' ? logView()
    : state.view === 'settings' ? settingsView()
    : boardView();
  paintTop();
}

/* ── 메뉴 ────────────────────────────── */
const menuEl = document.getElementById('menu');
const menuBtn = document.getElementById('bMenu');
function closeMenu() { menuEl.hidden = true; menuBtn.classList.remove('on'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (menuEl.hidden && !askPin()) return;
  const open = menuEl.hidden;
  menuEl.hidden = !open;
  menuBtn.classList.toggle('on', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) menuEl.querySelector('[data-m="undo"]').disabled = !((state.day || {}).swaps || []).length;
});
document.addEventListener('click', e => { if (!menuEl.hidden && !menuEl.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

menuEl.addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  const m = b.dataset.m; closeMenu();
  if (m === 'absent-a' || m === 'absent-b') {
    const role = m === 'absent-a' ? 'a' : 'b';
    const no = (state.day || {})[role];
    if (!no) return;
    if (confirm(no + '번 학생이 결석했나요?\n다음 번호 학생이 오늘 당번을 맡고, ' + no + '번은 다음 등교일 당번이 됩니다.')) markAbsent(role);
  } else if (m === 'undo') undoAbsent();
  else if (m === 'log') { state.view = 'log'; render(); loadRecent(); }
  else if (m === 'set') { state.view = 'settings'; render(); }
  else if (m === 'tv') {
    document.body.classList.toggle('tv');
    try { localStorage.setItem('duty66:tv', document.body.classList.contains('tv') ? '1' : '0'); } catch (err) {}
  } else if (m === 'full') {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
});

/* ── 본문 이벤트 ─────────────────────── */
document.getElementById('bMe').addEventListener('click', () => {
  state.picked = false; state.view = 'board'; render();
});

document.getElementById('main').addEventListener('click', async e => {
  if (e.target.closest('[data-pickroom]')) { if (!askPin()) return; saveMe(null); render(); return; }
  const pn = e.target.closest('[data-pickno]');
  if (pn) { saveMe(parseInt(pn.dataset.pickno, 10)); state.mode = 'focus'; render(); return; }

  const row = e.target.closest('[data-id]');
  if (row) { toggleTask(row.dataset.id, row.dataset.by); return; }
  const w = e.target.closest('[data-wrap]');
  if (w) { toggleWrap(w.dataset.wrap); return; }
  const sl = e.target.closest('[data-slot]');
  if (sl) { state.focusSlot = sl.dataset.slot === autoSlot() ? null : sl.dataset.slot; render(); return; }
  if (e.target.closest('[data-backnow]')) { state.focusSlot = null; render(); return; }
  if (e.target.closest('[data-togglelate]')) { state.showLate = !state.showLate; render(); return; }
  if (e.target.closest('[data-peek]')) { state.peek = !state.peek; render(); return; }
  if (e.target.closest('[data-mode]')) { state.mode = state.mode === 'focus' ? 'all' : 'focus'; render(); return; }
  if (e.target.closest('[data-back]')) { state.view = 'board'; render(); return; }

  const dh = e.target.closest('[data-delhol]');
  if (dh) { state.holidays = { dates: holidays().filter(x => x !== dh.dataset.delhol) }; await Store.set('config/holidays', state.holidays); render(); return; }
  if (e.target.closest('[data-delrow]')) { e.target.closest('.ed').remove(); return; }

  const add = e.target.closest('[data-addrow]');
  if (add) {
    const box = document.getElementById('ed' + add.dataset.addrow);
    const div = document.createElement('div');
    div.className = 'ed';
    div.innerHTML = '<select data-f="slot">' + SLOTS.map(s => '<option value="' + s.key + '">' + s.label + '</option>').join('') + '</select>'
      + '<input type="text" data-f="text" placeholder="할 일"><input type="text" data-f="note" placeholder="설명 (선택)">'
      + '<button class="del" data-delrow="1">✕</button>';
    box.appendChild(div); div.querySelector('[data-f=text]').focus(); return;
  }

  const sv = e.target.closest('[data-savetasks]');
  if (sv) {
    const role = sv.dataset.savetasks, prefix = role.toLowerCase();
    const list = [...document.querySelectorAll('#ed' + role + ' .ed')].map((el, i) => {
      const o = { id: prefix + (i + 1), slot: el.querySelector('[data-f=slot]').value, text: el.querySelector('[data-f=text]').value.trim() };
      const n = el.querySelector('[data-f=note]').value.trim(); if (n) o.note = n;
      return o;
    }).filter(o => o.text);
    const next = { ...tasksOf(), [role]: list, v: 1 };
    state.tasks = next; await Store.set('config/tasks', next);
    sv.textContent = '저장됨 ✓'; setTimeout(() => { sv.textContent = '저장'; }, 1600); return;
  }
  const rs = e.target.closest('[data-resettasks]');
  if (rs) {
    const role = rs.dataset.resettasks;
    if (!confirm('당번 ' + role + ' 항목을 처음 상태로 되돌릴까요?')) return;
    const next = { ...tasksOf(), [role]: DEFAULT_TASKS[role].map(x => ({ ...x })), v: 1 };
    state.tasks = next; await Store.set('config/tasks', next); render(); return;
  }

  if (e.target.id === 'savePin') {
    const v = document.getElementById('pinBox').value.trim();
    state.teacher = { pin: v };
    await Store.set('config/teacher', state.teacher);
    try { if (v) localStorage.setItem('duty66:unlock', v); else localStorage.removeItem('duty66:unlock'); } catch (err) {}
    e.target.textContent = '저장됨 ✓'; setTimeout(() => { e.target.textContent = '저장'; }, 1600);
    return;
  }
  if (e.target.id === 'fbSave') {
    const raw = document.getElementById('fbBox').value;
    try {
      const cfg = parseCfg(raw);
      localStorage.setItem('duty66:fbcfg', JSON.stringify(cfg));
      location.reload();
    } catch (err) {
      Store.note = '설정을 읽지 못했습니다 — ' + ((err && err.message) || err);
      render();
    }
    return;
  }
  if (e.target.id === 'fbClear') {
    try { localStorage.removeItem('duty66:fbcfg'); } catch (err) {}
    location.reload(); return;
  }
  if (e.target.id === 'saveNames') {
    const count = Math.max(2, Math.min(40, parseInt(document.getElementById('sCount').value, 10) || 22));
    const lines = document.getElementById('sNames').value.split('\n'), names = {};
    for (let i = 0; i < count; i++) {
      const v = (lines[i] || '').replace(/^\s*\d+\s*[번.\-)]?\s*/, '').trim();
      if (v) names[String(i + 1)] = v;
    }
    state.roster = { count, names, updatedAt: new Date().toISOString() };
    await Store.set('config/roster', state.roster);
    const rot = cloneRot(state.rotation);
    if (rot.order.length !== count) { rot.order = Array.from({ length: count }, (_, i) => i + 1); rot.cursor = rot.cursor % count; state.rotation = rot; await Store.set('config/rotation', rot); }
    render(); return;
  }
  if (e.target.id === 'saveCursor') {
    const rot = cloneRot(state.rotation);
    rot.cursor = parseInt(document.getElementById('sCursor').value, 10) || 0;
    state.rotation = rot; await Store.set('config/rotation', rot); render(); return;
  }
  if (e.target.id === 'clearQ') {
    const rot = cloneRot(state.rotation); rot.requeue = [];
    state.rotation = rot; await Store.set('config/rotation', rot); render(); return;
  }
  if (e.target.id === 'addHol') {
    const v = document.getElementById('sHol').value; if (!v) return;
    state.holidays = { dates: [...new Set([...holidays(), v])] };
    await Store.set('config/holidays', state.holidays); render(); return;
  }
  if (e.target.id === 'saveSlots') {
    const out = {};
    document.querySelectorAll('[data-slotfrom]').forEach(el => { out[el.dataset.slotfrom] = { from: el.value }; });
    document.querySelectorAll('[data-slotto]').forEach(el => { out[el.dataset.slotto] = { ...(out[el.dataset.slotto] || {}), to: el.value }; });
    state.slotTimes = out; await Store.set('config/slots', out);
    e.target.textContent = '저장됨 ✓'; setTimeout(() => { e.target.textContent = '시간대 저장'; }, 1600); return;
  }
  if (e.target.id === 'reroll') {
    if (!confirm('오늘 당번을 다시 배정할까요? 오늘 체크한 기록도 지워집니다.')) return;
    const rot = cloneRot(state.rotation), [a, b] = pickPair(rot);
    const day = { date: state.today, a, b, checks: {}, absent: [], swaps: [], wrap: {}, createdAt: new Date().toISOString() };
    state.day = day; state.rotation = rot;
    await Store.set('days/' + state.today, day); await Store.set('config/rotation', rot);
    state.view = 'board'; render(); return;
  }
});

try { if (localStorage.getItem('duty66:tv') === '1') document.body.classList.add('tv'); } catch (e) {}
paintTop();
boot();
</script>
